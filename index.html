<title>Old City, Philadelphia — open after dark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F6F2; --fg:#1B2033; --muted:rgba(27,32,51,.6); --panel:rgba(245,246,242,.72); --line:rgba(27,32,51,.14);
  --amber:#F0A23A;
  --ui:"Figtree","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --display:"Fraunces","Songti SC","Noto Serif SC",Georgia,serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0F1630; --fg:#E9ECF5; --muted:rgba(233,236,245,.6); --panel:rgba(15,22,48,.6); --line:rgba(233,236,245,.16); color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#0F1630; --fg:#E9ECF5; --muted:rgba(233,236,245,.6); --panel:rgba(15,22,48,.6); --line:rgba(233,236,245,.16); color-scheme:dark; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased}
#map{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#map.dragging{cursor:grabbing}

.ui{position:fixed;z-index:2;color:var(--fg);transition:color .5s}
.head{top:calc(env(safe-area-inset-top,0px) + 20px);left:calc(env(safe-area-inset-left,0px) + 24px);pointer-events:none;max-width:60vw}
.head h1{font:500 15px/1.3 var(--ui);margin:0;letter-spacing:.01em}
.head p{margin:2px 0 0;font-size:13px;color:var(--muted);transition:color .5s}
.clock{font-family:var(--display);font-optical-sizing:auto;font-weight:300;font-size:clamp(64px,12vw,148px);line-height:.9;margin:14px 0 0;letter-spacing:-.03em;font-variant-numeric:tabular-nums;transition:color .5s}
.when{font-size:15px;margin-top:8px;color:var(--muted);transition:color .5s}

.count{top:calc(env(safe-area-inset-top,0px) + 20px);right:calc(env(safe-area-inset-right,0px) + 24px);text-align:right;pointer-events:none}
.count b{display:block;font-family:var(--display);font-weight:300;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
#nOpen{color:var(--amber)}
.count small{font-size:13px;color:var(--muted)}
.legend{margin-top:14px;display:grid;gap:6px;justify-items:end;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;vertical-align:middle;margin-left:8px;width:10px;height:10px;border-radius:50%}
.lg-open{background:currentColor;box-shadow:0 0 8px 2px currentColor}
.lg-closed{border:1.4px solid currentColor}
.lg-na{width:4px!important;height:4px!important;background:currentColor;opacity:.6;margin-right:3px}
.dash{margin:18px 0 0 auto;width:268px;text-align:left;padding:14px 14px 12px;border-radius:14px;background:var(--panel);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);transition:background .5s,border-color .5s}
.dash h2{font:500 13px/1.3 var(--ui);margin:0 0 10px}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:color-mix(in srgb,var(--fg) 8%,transparent);margin-bottom:14px}
.stack span{height:100%;transition:width .4s ease,background .5s}
.rows{display:grid;gap:8px}
.r{display:grid;grid-template-columns:100px 1fr 36px;align-items:center;gap:8px;font-size:12px;transition:opacity .3s}
.r .lb{white-space:nowrap}
.r .bar{height:6px;border-radius:3px;background:color-mix(in srgb,var(--fg) 8%,transparent);overflow:hidden}
.r .bar i{display:block;height:100%;width:0;border-radius:3px;transition:width .4s ease,background .5s}
.r .pc{text-align:right;font-variant-numeric:tabular-nums}
.dash-note{margin-top:10px;font-size:11px;color:var(--muted)}

.dock{left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:min(880px,calc(100% - 24px));
  background:var(--panel);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
  border:1px solid var(--line);border-radius:18px;padding:14px 18px 12px;transition:background .5s,border-color .5s,color .5s}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row+.row{margin-top:10px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font:500 13px/1 var(--ui);color:inherit;background:transparent;border:1px solid transparent;border-radius:999px;padding:7px 11px;cursor:pointer;opacity:.62;transition:opacity .2s,background .2s,border-color .2s}
.chip:hover{opacity:1}
.chip[aria-pressed="true"]{opacity:1;border-color:var(--line);background:color-mix(in srgb,var(--fg) 9%,transparent)}
.chip:focus-visible,.play:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.sep{flex:1}
.cats .chip{font-size:12px;padding:6px 9px}
.sw{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0}

.scrub{display:flex;align-items:center;gap:14px;margin-top:12px}
.play{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--fg) 6%,transparent);color:inherit;cursor:pointer;display:grid;place-items:center}
.play svg{width:14px;height:14px;fill:currentColor}
.track{position:relative;flex:1;height:58px}
#hist{position:absolute;left:0;right:0;top:0;width:100%;height:40px;display:block}
.ticks{position:absolute;left:0;right:0;bottom:0;height:14px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.ticks span{position:absolute;transform:translateX(-50%)}
.ticks span:first-child{transform:none}.ticks span:last-child{transform:translateX(-100%)}
input[type=range]{position:absolute;left:0;right:0;top:0;width:100%;height:46px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:46px;background:transparent}
input[type=range]::-moz-range-track{height:46px;background:transparent}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:3px;height:46px;border-radius:2px;background:var(--amber);box-shadow:0 0 12px 2px rgba(240,162,58,.55)}
input[type=range]::-moz-range-thumb{width:3px;height:46px;border:0;border-radius:2px;background:var(--amber);box-shadow:0 0 12px 2px rgba(240,162,58,.55)}
input[type=range]:focus-visible{outline:2px solid var(--amber);outline-offset:4px;border-radius:4px}

.tip{position:fixed;z-index:3;pointer-events:none;min-width:200px;max-width:280px;padding:12px 14px;border-radius:12px;
  background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);color:var(--fg);
  font-size:13px;line-height:1.5;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s}
.tip.on{opacity:1;transform:none}
.tip h3{margin:0 0 2px;font:600 15px/1.3 var(--ui)}
.tip .t{color:var(--muted);font-size:12px}
.tip .s{margin-top:8px;font-weight:600}
.tip .s.open{color:var(--amber)}
.tip .hrs{color:var(--muted);font-size:12px;margin-top:2px}

@media (max-width:640px){
  .head{left:16px;top:calc(env(safe-area-inset-top,0px) + 14px)}
  .count{right:16px;top:calc(env(safe-area-inset-top,0px) + 14px)}
  .count b{font-size:32px}
  .legend{display:none}
  .dash{width:150px;margin-top:10px;padding:0;background:none;border:0;backdrop-filter:none;-webkit-backdrop-filter:none}
  .dash h2,.rows,.dash-note{display:none}
  .stack{margin:0;height:8px}
  .dock{padding:12px 12px 10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}
  .chip{padding:6px 8px;font-size:12px}
  .cats{flex-wrap:nowrap;overflow-x:auto;width:100%;scrollbar-width:none}
  .cats::-webkit-scrollbar{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

for(const [key,c] of Object.entries(COL)){ const hc2=document.createElement('canvas'); hc2.width=hc2.height=128;
  const g=hc2.getContext('2d'), r=g.createRadialGradient(64,64,0,64,64,64), [cr,cg,cb]=hex(c[2]), [lr,lg,lb]=hex(c[1]);
  r.addColorStop(0,`rgba(${lr},${lg},${lb},1)`); r.addColorStop(.12,`rgba(${cr},${cg},${cb},.85)`);
  r.addColorStop(.38,`rgba(${cr},${cg},${cb},.28)`); r.addColorStop(1,`rgba(${cr},${cg},${cb},0)`);
  g.fillStyle=r; g.fillRect(0,0,128,128); halos[key]=hc2; }

let dirty=true;
function draw(){
  const d=dark(st.min), bg=bgAt(d), ink=mix(INK_DAY,INK_NIGHT,d>.5?1:0), z=st.zoom;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
  ctx.fillStyle=rgb(bg); ctx.fillRect(0,0,W,H);

  // river
  const rx=sx(riverU);
  if(rx<W){ ctx.fillStyle=rgb(mix(bg,hex('#3E6A8A'),d>.5?.22:.16)); ctx.fillRect(rx,0,W-rx,H);
    ctx.save(); ctx.translate(Math.min(W-24,rx+28),H*.42); ctx.rotate(Math.PI/2);
    ctx.font=`italic 300 15px ${getComputedStyle(document.body).getPropertyValue('--display')}`;
    ctx.fillStyle=rgba(ink,.35); ctx.fillText('Delaware River',0,0); ctx.restore(); }

  // streets
  const lineC = mix(bg, d>.5?hex('#7C8BC4'):hex('#1B2033'), d>.5?.22:.18);
  ctx.lineWidth=Math.min(12,Math.max(1.2,base*z*5)); ctx.strokeStyle=rgb(lineC); ctx.lineCap='butt';
  ctx.font=`500 11px ${getComputedStyle(document.body).getPropertyValue('--ui')}`;
  for(const s of DATA.streets){
    ctx.beginPath();
    if(s.dir==='ew'){ const y=sy(s.v); ctx.moveTo(0,y); ctx.lineTo(Math.min(W,rx),y); }
    else { const x=sx(s.u); ctx.moveTo(x,0); ctx.lineTo(x,H); }
    ctx.stroke();
  }
  ctx.fillStyle=rgba(ink,.42);
  for(const s of DATA.streets){
    if(s.dir==='ew'){ const y=sy(s.v); ctx.fillText(s.name,Math.max(14,sx(minU)-110),y-6); }
    else { const x=sx(s.u); ctx.save(); ctx.translate(x-6,Math.min(H-170,sy(minV)+90)); ctx.rotate(-Math.PI/2); ctx.fillText(s.name,0,0); ctx.restore(); }
  }

  // compute screen positions
  for(const p of P){ p.sx=sx(p.u); p.sy=sy(p.v); }

  // closed rings + no-data dots
  const ringC=mix(hex('#8E9288'),hex('#55608A'),d);
  ctx.lineWidth=1.3;
  for(const p of P){ if(p.vis<.02) continue;
    if(!p.iv){ ctx.fillStyle=rgba(ringC,.55*p.vis); ctx.beginPath(); ctx.arc(p.sx,p.sy,1.6,0,7); ctx.fill(); continue; }
    const c=(1-p.a)*p.vis; if(c<.02) continue;
    ctx.strokeStyle=rgba(ringC,.9*c); ctx.beginPath(); ctx.arc(p.sx,p.sy,3.4,0,7); ctx.stroke(); }

  // halos: soft on paper by day, additive glow by night
  const R=(9+34*d)*Math.sqrt(z), haloA=.22+.5*d;
  ctx.globalCompositeOperation = d>.35 ? 'screen' : 'multiply';
  for(const p of P){ const a=p.a*p.vis; if(a<.02) continue;
    ctx.globalAlpha=a*(d>.35?haloA:.55); ctx.drawImage(halos[p.c],p.sx-R,p.sy-R,R*2,R*2); }
  ctx.globalCompositeOperation='source-over';
  // cores
  for(const p of P){ const a=p.a*p.vis; if(a<.02) continue;
    ctx.globalAlpha=a; ctx.fillStyle=rgb(mix(hex(COL[p.c][0]),hex(COL[p.c][1]),d)); ctx.beginPath(); ctx.arc(p.sx,p.sy,3.3,0,7); ctx.fill(); }
  ctx.globalAlpha=1;

  if(hover){ ctx.strokeStyle=rgba(ink,.85); ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(hover.sx,hover.sy,9,0,7); ctx.stroke(); }
}

function tick(){
  let moving=false;
  for(const p of P){
    const k=reduce?1:.2;
    const na=p.a+(p.tgt-p.a)*k, nv=p.vis+(p.visT-p.vis)*k;
    if(Math.abs(na-p.tgt)>.004||Math.abs(nv-p.visT)>.004) moving=true;
    p.a=Math.abs(na-p.tgt)>.004?na:p.tgt; p.vis=Math.abs(nv-p.visT)>.004?nv:p.visT;
  }
  if(moving||dirty){ draw(); dirty=false; }
  if(st.playing) advance();
  requestAnimationFrame(tick);
}

// ---------- UI ----------
const $=id=>document.getElementById(id);
const timeIn=$('time');
function update(){
  const t=st.day*1440+st.min, d=dark(st.min);
  let n=0,all=0;
  for(const p of P){ const inCat=st.cat==='all'||p.c===st.cat; p.visT=inCat?1:.06;
    const o=isOpen(p,t); p.tgt=o?1:0; if(inCat&&p.iv){all++; if(o) n++;} }
  $('nOpen').textContent=n; $('nAll').textContent=all; updateDash(t,d);
  $('clock').textContent=fmt(st.min);
  $('when').textContent=DAYS_LONG[st.day]+' '+period(st.min);
  timeIn.value=st.min; timeIn.setAttribute('aria-valuetext',DAYS[st.day]+' '+fmt(st.min));
  // chrome theme follows the sky
  const bg=bgAt(d), night=d>.5, root=document.documentElement.style;
  root.setProperty('--bg',rgb(bg));
  root.setProperty('--fg',night?'#E9ECF5':'#1B2033');
  root.setProperty('--muted',night?'rgba(233,236,245,.62)':'rgba(27,32,51,.62)');
  root.setProperty('--panel',rgba(night?mix(bg,hex('#0A0F22'),.4):mix(bg,[255,255,255],.5),night?.62:.72));
  root.setProperty('--line',night?'rgba(233,236,245,.16)':'rgba(27,32,51,.14)');
  document.documentElement.style.colorScheme=night?'dark':'light';
  drawHist(); if(hover) showTip(hover); dirty=true;
}

// days + cats
const daysEl=$('days'), catsEl=$('cats');
DAYS.forEach((n,i)=>{ const b=document.createElement('button'); b.className='chip'; b.textContent=n;
  b.onclick=()=>{st.day=i; syncChips(); computeHist(); update();}; daysEl.appendChild(b); });
CATS.forEach(([k,n])=>{ const b=document.createElement('button'); b.className='chip'; b.dataset.k=k;
  if(k!=='all'){ const s=document.createElement('i'); s.className='sw'; s.style.background=COL[k][2]; b.appendChild(s); }
  b.appendChild(document.createTextNode(n));
  b.onclick=()=>{st.cat=k; syncChips(); computeHist(); update();}; catsEl.appendChild(b); });
// dashboard: share of open places by type
const dashCats=CATS.filter(c=>c[0]!=='all'), rowsEl=$('rows'), stackEl=$('stack'), rowRefs={};
dashCats.forEach(([k,n])=>{ const r=document.createElement('div'); r.className='r';
  r.innerHTML='<span class="lb"><i class="sw"></i></span><span class="bar"><i></i></span><span class="pc">0%</span>';
  r.querySelector('.lb').appendChild(document.createTextNode(n));
  rowsEl.appendChild(r); const s=document.createElement('span'); stackEl.appendChild(s);
  rowRefs[k]={r,sw:r.querySelector('.sw'),fill:r.querySelector('.bar i'),pc:r.querySelector('.pc'),seg:s}; });
function updateDash(t,d){
  const cnt={}; let tot=0;
  for(const p of P){ if(p.iv&&isOpen(p,t)){ cnt[p.c]=(cnt[p.c]||0)+1; tot++; } }
  const ci=d>.5?2:0;
  for(const [k] of dashCats){ const R=rowRefs[k], c=cnt[k]||0, pct=tot?c/tot*100:0, col=COL[k][ci];
    R.fill.style.width=pct+'%'; R.fill.style.background=col; R.sw.style.background=col;
    R.seg.style.width=pct+'%'; R.seg.style.background=col;
    R.pc.textContent=Math.round(pct)+'%'; R.r.title=`${c} open`;
    R.r.style.opacity=(st.cat==='all'||st.cat===k)?1:.35; }
  $('dashNote').textContent=tot?`Share of the ${tot} places open now`:'Nothing is open right now';
}
function syncChips(){ [...daysEl.children].forEach((b,i)=>b.setAttribute('aria-pressed',i===st.day));
  [...catsEl.children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===st.cat)); }
const naCount=P.filter(p=>!p.iv).length; $('naNote').firstChild.textContent=`${naCount} with no hours listed`;

timeIn.addEventListener('input',()=>{ st.min=+timeIn.value; update(); });

// histogram of open places across the chosen day
const hc=$('hist'), hx=hc.getContext('2d'); let hist=[], hmax=1;
function computeHist(){ hist=[]; for(let m=0;m<1440;m+=15){ const t=st.day*1440+m; let n=0;
  for(const p of P) if((st.cat==='all'||p.c===st.cat)&&isOpen(p,t)) n++; hist.push(n); }
  hmax=Math.max(1,...hist); }
function sizeHist(){ const r=hc.getBoundingClientRect(); hc.width=r.width*dpr; hc.height=r.height*dpr; drawHist(); }
function drawHist(){ if(!hist.length) return; const w=hc.width/dpr,h=hc.height/dpr; hx.setTransform(dpr,0,0,dpr,0,0); hx.clearRect(0,0,w,h);
  const night=dark(st.min)>.5, bw=w/hist.length, cur=Math.floor(st.min/15);
  hist.forEach((n,i)=>{ const bh=Math.max(1,(n/hmax)*(h-6));
    hx.fillStyle = i===cur?'#F0A23A':(night?'rgba(233,236,245,.22)':'rgba(27,32,51,.16)');
    hx.fillRect(i*bw+.5,h-bh,Math.max(1,bw-1.2),bh); }); }

// play
let lastStep=0;
function advance(){ const t=performance.now(); if(t-lastStep<60) return; lastStep=t;
  st.min+=5; if(st.min>=1440){ st.min=0; st.day=(st.day+1)%7; syncChips(); computeHist(); } update(); }
$('play').onclick=()=>{ st.playing=!st.playing;
  $('playIcon').innerHTML=st.playing?'<path d="M2.5 1.5h3.2v11H2.5zM8.3 1.5h3.2v11H8.3z"/>':'<path d="M3 1.5v11l9.5-5.5z"/>';
  $('play').setAttribute('aria-label',st.playing?'Pause':'Play through the day'); };

// tooltip + hover
const tip=$('tip'); let hover=null;
function pick(x,y){ let best=null,bd=16*16; for(const p of P){ if(p.visT<.5) continue; const dx=p.sx-x,dy=p.sy-y,dd=dx*dx+dy*dy; if(dd<bd){bd=dd;best=p;} } return best; }
function showTip(p){
  const t=st.day*1440+st.min, nc=nextChange(p,t);
  let s,cls='';
  if(!p.iv) s='No hours listed';
  else if(nc.at===null) s = nc.open?'Open':'Closed all week';
  else { const cd=Math.floor(nc.at/1440), pre = (cd===st.day&&nc.dt<1440)?'':(cd===(st.day+1)%7&&nc.dt<1440)?'tomorrow ':DAYS[cd]+' ';
    if(nc.open){ cls='open'; s=`Open, closes ${pre}${fmt(nc.at)}`; } else s=`Closed, opens ${pre}${fmt(nc.at)}`; }
  const hrs=p.h?`${DAYS_LONG[st.day]}: ${p.h[st.day]}`:'';
  tip.innerHTML=`<h3></h3><div class="t"></div><div class="s ${cls}"></div><div class="hrs"></div>`;
  tip.querySelector('h3').textContent=p.n;
  tip.querySelector('.t').textContent=`${CATNAME[p.c]} (${p.t}), ${p.a}`;
  tip.querySelector('.s').textContent=s; tip.querySelector('.s').style.color = cls ? COL[p.c][dark(st.min)>.5?2:0] : ''; tip.querySelector('.hrs').textContent=hrs;
  const r=tip.getBoundingClientRect(); let x=p.sx+16, y=p.sy-r.height/2;
  if(x+r.width>W-12) x=p.sx-16-r.width; y=Math.max(12,Math.min(H-r.height-12,y));
  tip.style.left=x+'px'; tip.style.top=y+'px'; tip.classList.add('on');
}
function hideTip(){ tip.classList.remove('on'); }

// pan / zoom / pick with pointers
const ptrs=new Map(); let drag=null, pinch=null, moved=false;
cv.addEventListener('pointerdown',e=>{ cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved=false;
  if(ptrs.size===1) drag={x:e.clientX,y:e.clientY,px:st.panX,py:st.panY};
  if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:st.zoom}; drag=null; } });
cv.addEventListener('pointermove',e=>{
  if(ptrs.has(e.pointerId)) ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size===2){ const [a,b]=[...ptrs.values()]; setZoom(pinch.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d,(a.x+b.x)/2,(a.y+b.y)/2); moved=true; return; }
  if(drag){ const dx=e.clientX-drag.x, dy=e.clientY-drag.y; if(Math.abs(dx)+Math.abs(dy)>4){moved=true;cv.classList.add('dragging');}
    if(moved){ st.panX=drag.px+dx; st.panY=drag.py+dy; dirty=true; hover=null; hideTip(); } return; }
  if(e.pointerType==='mouse'){ const p=pick(e.clientX,e.clientY); if(p!==hover){ hover=p; dirty=true; p?showTip(p):hideTip(); cv.style.cursor=p?'pointer':''; } }
});
const up=e=>{ ptrs.delete(e.pointerId); if(ptrs.size<2) pinch=null; cv.classList.remove('dragging');
  if(drag&&!moved&&e.type==='pointerup'){ const p=pick(e.clientX,e.clientY); hover=p; dirty=true; p?showTip(p):hideTip(); }
  drag=null; };
cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
cv.addEventListener('pointerleave',e=>{ if(e.pointerType==='mouse'&&!drag){ hover=null; hideTip(); dirty=true; } });
function setZoom(z,cx,cy){ z=Math.min(5,Math.max(.7,z));
  // keep the point under the cursor fixed
  const f=z/st.zoom; st.panX=cx-(cx-st.panX-(1-st.zoom)*W/2)*f-(1-z)*W/2; st.panY=cy-(cy-st.panY-(1-st.zoom)*H/2)*f-(1-z)*H/2;
  st.zoom=z; dirty=true; hideTip(); hover=null; }
cv.addEventListener('wheel',e=>{ e.preventDefault(); setZoom(st.zoom*Math.exp(-e.deltaY*.0015),e.clientX,e.clientY); },{passive:false});
cv.addEventListener('dblclick',()=>{ st.zoom=1; st.panX=st.panY=0; dirty=true; });

// keyboard: arrows move time when map is focused-ish
addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT'||e.target.tagName==='BUTTON') return;
  if(e.key==='ArrowRight'){ st.min=(st.min+15)%1440; update(); } if(e.key==='ArrowLeft'){ st.min=(st.min+1425)%1440; update(); }
  if(e.key===' '){ e.preventDefault(); $('play').click(); } });

addEventListener('resize',resize);
syncChips(); computeHist(); resize(); update();
for(const p of P) { p.a=p.tgt; p.vis=p.visT; }
if(document.fonts) document.fonts.ready.then(()=>{dirty=true;});
requestAnimationFrame(tick);
})();
</script>
</body>
</html>
